name = "macros-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Models tried in order; if one is busy, slow or rate-limited, the next is used.
# Flash-Lite answers in ~1 s; gemini-3.8-flash was constantly overloaded (503) on the free tier.
GEMINI_MODEL = "gemini-3.5-flash-lite,gemini-3.6-flash"
ALLOWED_ORIGINS = "https://alessiospeiser-hub.github.io,http://localhost:8765,http://127.0.0.1:8765,http://localhost:8000"

# Secrets are NOT stored here. Set them once with:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put APP_PASSCODE

# Cloud sync storage (your data, shared by all your devices)
[[d1_databases]]
binding = "DB"
database_name = "macros-db"
database_id = "68845baf-553a-40a8-b494-32bc4001a26c"
